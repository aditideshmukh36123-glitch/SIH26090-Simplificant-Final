[project]
name = "sih26090-ai-microservice"
version = "0.1.0"
description = "SIH26090 AI microservice — FastAPI + Gemini + Rembg + Cloudinary (independent service)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6,<1.0.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "anyio>=4.6.0",
    "rembg>=2.0.64",
    "onnxruntime>=1.21.0",
    "Pillow>=11.1.0",
    "numpy>=2.2.1",
    "cloudinary>=1.40.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.1",
    "ruff>=0.8.6",
    "pytest>=8.3.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["rembg", "google", "google.genai", "cloudinary", "cloudinary.uploader", "cloudinary.utils", "cloudinary.exceptions"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]